# Publica RENIVYA gratis en GitHub Pages: https://<usuario>.github.io/<repositorio>/
#  - en cada push a main (cambios de la app),
#  - cada 15 minutos (noticias nuevas: feeds RSS → motor → traducción → data/app.json),
#  - o a mano desde la pestaña Actions.
# Requisito único: Ajustes del repositorio › Pages › Source: «GitHub Actions».
name: Deploy RENIVYA
on:
  push:
    # La rama de trabajo publica directamente (el entorno github-pages solo admite la rama por defecto).
    branches: [main, claude/zealous-mccarthy-gem1zx]
  schedule:
    - cron: '7,22,37,52 * * * *' # cada 15 minutos
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Rutas de publicación
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "BASE_PATH=/${REPO_NAME}/" >> "$GITHUB_ENV"
          echo "PREVIOUS_SNAPSHOT_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/data/snapshot.json" >> "$GITHUB_ENV"
          echo "APP_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/" >> "$GITHUB_ENV"
      # Noticias: parte del snapshot publicado (las historias evolucionan entre ejecuciones),
      # descarga los feeds RSS y ejecuta el motor. Si ningún feed responde, datos de demostración.
      # Traducción es/en con la API de Claude: solo si existe el secreto ANTHROPIC_API_KEY
      # (Settings › Secrets and variables › Actions). Sin él, cada historia se muestra solo
      # en su idioma original. TRANSLATE_MODEL y TRANSLATE_MAX son variables opcionales.
      - run: npm run snapshot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          TRANSLATE_MAX: ${{ vars.TRANSLATE_MAX }}
          # Avisos de última hora: código que genera la app en Perfil → Avisos.
          RENIVYA_AVISOS: ${{ secrets.RENIVYA_AVISOS }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Las ejecuciones programadas de GitHub se retrasan o se saltan a menudo. Para que las noticias
  # se actualicen de verdad cada ~15 minutos, cada ejecución lanza la siguiente al terminar.
  # Solo continúa la cadena la ejecución más reciente (nunca se multiplican).
  next:
    needs: deploy
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Próxima actualización en unos 15 minutos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 780
          newest=$(gh run list -R "$GITHUB_REPOSITORY" -w deploy.yml -L 30 --json databaseId,status --jq '[.[] | select(.status != "completed") | .databaseId] | max')
          if [ "$newest" = "$GITHUB_RUN_ID" ]; then
            gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          else
            echo "Hay una ejecución más reciente: ella continúa la cadena."
          fi
