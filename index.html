<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS: app web en pantalla de inicio -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RENIVYA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // App instalada (pantalla de inicio): sin zoom ni alejar, todo ajustado a la pantalla.
      // En el navegador normal se puede seguir haciendo zoom.
      (function () {
        try {
          var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
          if (!standalone) return;
          document.documentElement.classList.add('standalone');
          document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
          var stop = function (e) { e.preventDefault(); };
          // Pellizcar para ampliar (Safari en iPhone). El doble toque lo bloquea touch-action en CSS.
          document.addEventListener('gesturestart', stop, { passive: false });
          document.addEventListener('gesturechange', stop, { passive: false });
          document.addEventListener('gestureend', stop, { passive: false });
          document.addEventListener('touchmove', function (e) { if (e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191613" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="RENIVYA — Inteligencia informativa global" />
    <title>RENIVYA — Inteligencia informativa global</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar parpadeo.
      (function () {
        try {
          var t = localStorage.getItem('renivya:theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var size = localStorage.getItem('renivya:text-size');
          if (size) document.documentElement.classList.add('text-size-' + size);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
